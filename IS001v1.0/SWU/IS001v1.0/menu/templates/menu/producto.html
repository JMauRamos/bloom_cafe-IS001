{% extends "base_clientes.html" %}

{% block title %} Menu {% endblock %}

{% block content %}

    <div class="app">
            <!-- IMAGEN -->
            <div class="producto-imagen">
              <img src="/resources/latte.jpg" alt="Latte">
            </div>

            <!-- NOMBRE Y PRECIO -->
            <div class="titulo-precio">
                <h2>Latte</h2>
                <span id="precio">$70</span>
            </div>

            <p class="descripcion">
                Delicioso café latte preparado con espresso
                y leche cremosa.
            </p>
            <hr>
            <!-- TAMAÑO -->

            <h3>Tamaño</h3>
            <div class="tamanos">
                <button onclick="seleccionarTamano(60, this)">
                    Chico
                    <span>$60</span>
                </button>

                <button class="seleccionado" onclick="seleccionarTamano(70, this)">
                    Mediano
                    <span>$70</span>
                </button>

                <button onclick="seleccionarTamano(80, this)">
                    Grande
                    <span>$80</span>
                </button>
            </div>

            <!-- EXTRAS -->

            <h3>Extras</h3>
            <label class="extra">
                <input type="checkbox" value="10" onchange="actualizarPrecio()">
                <span>Leche de almendra</span>
                <b>+$10</b>
            </label>


            <label class="extra">
                <input type="checkbox" value="10" onchange="actualizarPrecio()">
                <span>Vainilla</span>
                <b>+$10</b>
            </label>

            <label class="extra">
                <input type="checkbox" value="10" onchange="actualizarPrecio()">
                <span>Crema batida</span>
                <b>+$10</b>
            </label>

            <!-- CANTIDAD -->

            <div class="cantidad_compra">
                <h3>Cantidad</h3>
                <div class="contador">
                    <button onclick="cambiarCantidad(-1)">−</button>
                    <span id="num_contador">1</span>
                    <button onclick="cambiarCantidad(1)">+</button>
                </div>
            </div>

            <!-- AGREGAR -->

            <button type="submit" class="agregar" onclick="agregarAlCarrito()">
                Agregar al carrito
            </button>
    </div>

{% endblock %}
