{% extends "base_clientes_alt.html" %}
{% load static %}

{% block title %} Mi Carrito {% endblock %}

{% block content %}

<section id="main_carrito">
        <div id="detalles_compra">
            <form id="form_detalles" action="">
                {% csrf_token %}
                <div id="metodos_pago">
                    <h2>Metodo de Pago</h2>
                    <div class="opciones_detalles">
                        <div class="opcion">
                            <input type="radio" id="terminal" name="metodo_pago" value="terminal" required/>
                            <label for="terminal"><i class="bi bi-credit-card-fill"></i>Terminal</label>
                        </div>
                        <div class="opcion">
                            <input type="radio" id="efectivo" name="metodo_pago" value="efectivo" />
                            <label for="efectivo"><i class="bi bi-cash"></i>Efectivo</label>
                        </div>
                    </div>
                </div>
                <div id="lugares_entrega">
                    <h2>Lugar de Entrega</h2>
                    <div class="opciones_detalles">
                        <div class="opcion">
                            <input type="radio" id="barra" name="lugar_entrega" value="barra" required/>
                            <label for="barra"><i class="bi bi-bag-fill"></i>Recoger en Barra</label>
                        </div>
                        <div class="opcion">
                            <input type="radio" id="puerta" name="lugar_entrega" value="puerta" />
                            <label for="puerta"><i class="bi bi-bag-fill"></i>Recoger en Puerta</label>
                        </div>
                    </div>
                </div>
                <div id="fecha_hora">
                    <h2>Fecha y Hora de Entrega</h2>
                    <div class="opciones_detalles">
                        <div class="opcion">
                            <label for="fecha"><i class="bi bi-calendar-minus-fill"></i></label>
                            <input type="date" id="fecha" name="fecha" required>
                        </div>
                        <div class="opcion">
                            <label for="hora"><i class="bi bi-clock-fill"></i></label>
                            <input type="time" id="hora" name="hora" step="600" required>
                        </div>
                    </div>
                </div>
                <div id="datos_personales">
                    <h2>Datos Personales</h2>
                    <div class="opciones_detalles">
                        <div class="opcion">
                            <label for="nombre"><i class="bi bi-person-fill"></i></i></label>
                            <input type="text" id="nombre" name="nombre" required placeholder="ej. Juan Perez">
                        </div>
                        <div class="opcion">
                            <label for="num_tel"><i class="bi bi-phone-fill"></i></label>
                            <input type="tel" id="num_tel" name="num_tel" minlength="10" maxlength="12" required placeholder="ej. 123-456-7890">
                        </div>
                    </div>
                </div>
                <div id="submit_carrito">
                    <button id="confirmar_pedido" type="submit">Confirmar Pedido</button>
                </div>
            </form>
        </div>
        <div id="carrito">
            <section>
                <span class="info_carrito">Mi Carrito</span>
            </section>
            <section class="productos_carrito">

            </section>
            <section id="bottom_carrito">
                <div class="info_carrito">
                    <span>Total</span>
                    <span id="total_carrito">$00.00</span>
                </div>
            </section>
        </div>
    </section>

{% endblock %}

{% block scripts %}
    <script src="{% static 'js/productoDetalle.js' %}"></script>
    <script src="{% static 'js/checkout.js' %}"></script>
{% endblock %}
