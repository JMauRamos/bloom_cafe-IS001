{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Café - {% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static "css/style_clientes.css" %}">
    <link rel="stylesheet" href="{% static "css/historial.css" %}">
    <link rel="icon" type="image/x-icon" href="{% static "images/favico.ico" %}">
</head>
<body>
    <header>
        <div class="menu_abrir">
            <div class="icono_cerrar">
                <span><i id="cerrar_trigger" class="bi bi-x"></i></span>
            </div>
            <ul id="opciones_menu">
                <li><a href="{%url 'inicio' %}"><i class="bi bi-house"></i>Inicio</a></li>
                <li><a href="{%url 'menu_principal' %}"><i class="bi bi-fork-knife"></i>Menu</a></li>
                <li><a href="{%url 'mis_pedidos' %}"><i class="bi bi-bag"></i>Mis Pedidos</a></li>
            </ul>
        </div>
        <nav>
            <span><i id="menu_trigger" class="bi bi-list"></i></span>
            <div id="logo_nav">
                <a href="{%url 'menu_principal' %}"><img id="logo" src="{% static "images/Logo.jpeg" %}" alt="Logo de Bloom Café"></a>
            </div>
            <span><i id="carrito_trigger" class="bi bi-cart2"></i></span>     
        </nav>
        <div class="carrito_abrir">
            <div class="icono_cerrar_carrito">
                <span><i id="cerrar_carrito" class="bi bi-x"></i></span>
            </div>
            <div id="carrito">
                <section>
                    <span class="info_carrito">Mi Carrito</span>
                </section>
                <section class="productos_carrito">
                    <div class="producto_carrito">
                        <img src="/resources/producto_temp.jpg" alt="Foto">
                        <div class="desc_carrito">
                            <div class="producto_precio">
                                <p class="nombre_producto">Producto #1</p>
                                <p><span class="precio_carrito">$00.00</span></p>
                            </div>
                            <div class="editar_producto"> 
                                <div class="cantidad_producto">
                                    <div class="mas_menos" id="menos">
                                        <i class="bi bi-dash"></i>
                                    </div>
                                    <div>
                                        <span class="cantidad">1</span>
                                    </div>
                                    <div class="mas_menos" id="mas">
                                        <i class="bi bi-plus"></i>
                                    </div>
                                </div>
                                <div class="eliminar_producto">
                                    <i class="bi bi-trash-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="producto_carrito">
                        <img src="/resources/producto_temp.jpg" alt="Foto">
                        <div class="desc_carrito">
                            <div class="producto_precio">
                                <p class="nombre_producto">Producto #2</p>
                                <p><span class="precio_carrito">$00.00</span></p>
                            </div>
                            <div class="editar_producto"> 
                                <div class="cantidad_producto">
                                    <div class="mas_menos" id="menos">
                                        <i class="bi bi-dash"></i>
                                    </div>
                                    <div>
                                        <span class="cantidad">2</span>
                                    </div>
                                    <div class="mas_menos" id="mas">
                                        <i class="bi bi-plus"></i>
                                    </div>
                                </div>
                                <div class="eliminar_producto">
                                    <i class="bi bi-trash-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="bottom_carrito">
                    <div class="info_carrito">
                        <span>Total</span>
                        <span>$00.00</span>
                    </div>
                    <a href="{%url 'checkout' %}">Ir a Pagar</a>
                </section>
            </div>
        </div>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <script src="{% static "js/abrirMenu.js" %}"></script>
        <script src="{% static "js/abrirCarrito.js" %}"></script>
    </footer>
</body>
</html>
